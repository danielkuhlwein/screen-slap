name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Analyse
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project screen-slap.xcodeproj -scheme screen-slap

      # Tests require macOS 26+ (Tahoe) which isn't available on CI runners yet.
      # Build-only verifies compilation and static analysis.
      - name: Build & Analyse
        run: |
          xcodebuild clean build analyze \
            -project screen-slap.xcodeproj \
            -scheme screen-slap \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO
